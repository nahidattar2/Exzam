<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>اختبار قصير: الأعمدة والمسافة</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:wght@600;700&display=swap">
<style>
:root{--bg:#f6f1e6;--card:#fff;--tx:#1b2a41;--mut:#5d6b82;--pri:#1f5fae;--pri2:#e8f0fb;--ok:#1b8a4b;--okb:#e3f5ea;--bad:#c0392b;--badb:#fbe7e4;--bd:#d9d2c0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;--card:#192230;--tx:#eef2f8;--mut:#9fb0c8;--pri:#6aa7f0;--pri2:#22344d;--ok:#4cc884;--okb:#173a28;--bad:#ff8577;--badb:#42201c;--bd:#2c3a50}}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Tajawal","Segoe UI",Tahoma,Arial,sans-serif;line-height:1.7;min-height:100vh}
.w{max-width:640px;margin:0 auto;padding:16px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:18px;padding:20px;margin-bottom:14px}
h1{font-size:1.5rem;margin:.2rem 0;color:var(--pri);text-align:center}
.sub{text-align:center;color:var(--mut);margin:0 0 4px}
.stats{display:flex;gap:8px;margin:16px 0}
.stats div{flex:1;background:var(--pri2);border-radius:12px;text-align:center;padding:10px 4px}
.stats b{display:block;font-size:1.4rem;color:var(--pri)}
label{display:block;margin:10px 0 4px;font-weight:600}
input{width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);font:inherit}
button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:12px 18px;background:var(--pri);color:#fff;font-weight:700}
button.sec{background:var(--pri2);color:var(--pri)}
button:disabled{opacity:.4;cursor:default}
.full{width:100%;margin-top:14px}
.hide{display:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-weight:700}
.timer{background:var(--pri2);color:var(--pri);padding:4px 14px;border-radius:20px;direction:ltr}
.timer.low{background:var(--badb);color:var(--bad)}
.bar{height:8px;background:var(--pri2);border-radius:8px;overflow:hidden;margin-bottom:14px}
.bar i{display:block;height:100%;background:var(--pri);width:0;transition:width .3s}
.tag{display:inline-block;font-size:.8rem;padding:2px 10px;border-radius:20px;background:var(--pri2);color:var(--pri);margin-bottom:8px}
.q{font-size:1.1rem;font-weight:700;margin:0 0 12px}
.hint{color:var(--mut);font-size:.9rem;margin:-6px 0 10px}
.opt{display:block;width:100%;text-align:right;background:var(--bg);color:var(--tx);border:2px solid var(--bd);margin-bottom:8px;font-weight:500}
.opt.sel{border-color:var(--pri);background:var(--pri2)}
.opt.ok{border-color:var(--ok);background:var(--okb)}
.opt.no{border-color:var(--bad);background:var(--badb)}
.nav{display:flex;gap:10px;justify-content:space-between;margin-top:12px}
.nav button{flex:1}
.score{text-align:center;font-size:2.6rem;font-weight:800;color:var(--pri);margin:0;direction:ltr}
.lvl{text-align:center;font-weight:700;margin:0 0 6px}
.ex{margin-top:8px;padding:10px;border-radius:10px;background:var(--pri2);font-size:.95rem}
.small{color:var(--mut);font-size:.85rem;text-align:center}
.ltr{direction:ltr;unicode-bidi:isolate}
.mx{direction:ltr;unicode-bidi:isolate;display:inline-block;font-family:"STIX Two Text","Cambria Math","Times New Roman",serif;font-size:1.35em;font-weight:600;white-space:nowrap}
.rd{display:inline-flex;align-items:stretch;margin:0 3px;vertical-align:middle;line-height:1.15}
.rs{width:.8em;height:auto;overflow:visible;flex:none}
.rs path{fill:none;stroke:currentColor;stroke-width:2.2;stroke-linejoin:miter;stroke-linecap:butt;vector-effect:non-scaling-stroke}
.ov{border-top:2.2px solid currentColor;padding:.12em .3em 0 .08em}
.lg{display:block;margin:0 auto 10px;max-width:110px;max-height:110px;object-fit:contain;border-radius:12px}
.sg{display:block;margin:14px auto 0;max-width:150px;max-height:80px;object-fit:contain}
</style>
</head>
<body>
<div class="w">

<div id="s0" class="card">
  <img class="lg" src="IMG_3624.jpeg" alt="شعار الأكاديمية" onerror="this.style.display='none'">
  <h1>اختبار الأعمدة والمسافة</h1>
  <p class="sub">الدرس 2-6 | الفصل 2: التوازي والتعامد</p>
  <p class="sub">إعداد معلمة الرياضيات: ناهد علي عطار</p>
  <div class="stats"><div><b>٦</b>أسئلة</div><div><b>٥</b>دقائق</div></div>
  <label for="nm">اسم الطالبة</label><input id="nm" autocomplete="off">
  <label for="cl">الصف / الشعبة</label><input id="cl" autocomplete="off">
  <button class="full" id="go">ابدئي الاختبار</button>
  <p class="small">يمكنكِ الرجوع وتعديل إجاباتك قبل التسليم.</p>
  <img class="sg" src="894BB46B-44DC-4FFC-BC67-B3EE32510A8C.png" alt="توقيع المعلمة" onerror="this.style.display='none'">
</div>

<div id="s1" class="hide">
  <div class="card">
    <div class="top"><span id="cnt"></span><span class="timer" id="tm">05:00</span></div>
    <div class="bar"><i id="pg"></i></div>
    <span class="tag" id="tg"></span>
    <p class="q" id="qt"></p>
    <p class="hint" id="hn"></p>
    <div id="fg"></div>
    <div id="ops"></div>
    <div class="nav"><button class="sec" id="pv">السابق</button><button id="nx">التالي</button></div>
  </div>
</div>

<div id="s2" class="hide">
  <div class="card">
    <h1>نتيجة الاختبار</h1>
    <p class="sub" id="who"></p>
    <p class="score" id="sc"></p>
    <p class="lvl" id="lv"></p>
    <p class="small" id="bk"></p>
    <img class="sg" src="894BB46B-44DC-4FFC-BC67-B3EE32510A8C.png" alt="توقيع المعلمة" onerror="this.style.display='none'">
  </div>
  <div id="rv"></div>
</div>

</div>
<script>
var Q=[
{t:"متوسط",q:"البعد بين النقطة (−2, 5) والمستقيم x = 4 يساوي:",o:["2","4","6","9"],a:2,e:"المستقيم x = 4 رأسي، فالبعد هو الفرق بين الإحداثيين السينيين: |4 − (−2)| = 6."},
{t:"متوسط",q:"إذا كان مستقيمان في المستوى متساويي البعد عن مستقيم ثالث، فإنهما:",o:["متقاطعان","متوازيان","متعامدان","منطبقان دائمًا"],a:1,e:"حسب النظرية 2.9: المستقيمان المتساويا البعد عن مستقيم ثالث في المستوى متوازيان."},
{t:"متوسط",q:"البعد بين النقطة (0, 0) والمستقيم y = −x + 2 يساوي:",o:["1","2","√2","2√2"],a:2,e:"العمود من (0, 0) هو y = x ويقطع المستقيم في (1, 1)، فالبعد = √(1 + 1) = √2."},
{t:"تفكير عليا",q:"المستقيمان y = x + 2 و y = x − 4 متوازيان. البعد بينهما يساوي:",o:["3","6","3√2","4√2"],a:2,h:"إرشاد: استعملي مستقيمًا عموديًا عليهما مثل y = −x.",e:"y = −x يقطع المستقيمين في (−1, 1) و (2, −2)، فالبعد = √(9 + 9) = 3√2."},
{t:"تفكير عليا",q:"المستقيمان m و n متوازيان والبعد بينهما 4 cm. القطعة AB طولها 10 cm وتقع على m، والنقطة C تتحرك على n. ما مساحة المثلث ABC؟",o:["20 cm² وتتغير بتغير موضع C","20 cm² وتبقى ثابتة مهما كان موضع C","40 cm² وتبقى ثابتة","لا يمكن تحديدها"],a:1,e:"المساحة = ½ × 10 × 4 = 20 cm². الارتفاع هو البعد بين المستقيمين المتوازيين وهو ثابت، فلا تتغير المساحة."},
{t:"تفكير عليا",q:'إذا كانت المسافة بين النقطة <span class="ltr">(2, 8)</span> والمستقيم الذي معادلته <span class="ltr">x − 2y − k = 0</span> تساوي √5، فما قيمة k؟',o:['<span class="ltr">k = 9, k = −19</span>','<span class="ltr">k = −9, k = −19</span>','<span class="ltr">k = 14, k = −19</span>','<span class="ltr">k = 5, k = −5</span>'],a:1,h:"إرشاد: ضعي المعادلة على الصورة القياسية ثم استعملي قانون البعد بين نقطة ومستقيم.",e:'الصورة القياسية: <span class="ltr">1x + (−2)y + (−k) = 0</span>. المقام √(1 + 4) = √5، فيصبح <span class="ltr">|2(1) + 8(−2) − k| = 5</span> أي <span class="ltr">|−14 − k| = 5</span>. إمّا <span class="ltr">−14 − k = 5</span> فتكون <span class="ltr">k = −19</span>، أو <span class="ltr">−14 − k = −5</span> فتكون <span class="ltr">k = −9</span>.'}
];
var FIG5='<svg viewBox="0 0 340 190" style="width:100%;max-width:420px;display:block;margin:0 auto 12px;direction:ltr" font-family="Segoe UI,Tahoma,Arial,sans-serif" font-size="13">'+
'<polygon points="70,45 250,45 190,145" fill="var(--pri2)" stroke="var(--pri)" stroke-width="2"/>'+
'<polygon points="70,45 250,45 110,145" fill="none" stroke="var(--mut)" stroke-width="1.2" stroke-dasharray="4 4"/>'+
'<line x1="15" y1="45" x2="305" y2="45" stroke="var(--tx)" stroke-width="2.5"/>'+
'<line x1="15" y1="145" x2="305" y2="145" stroke="var(--tx)" stroke-width="2.5"/>'+
'<line x1="190" y1="145" x2="190" y2="45" stroke="var(--bad)" stroke-width="1.6" stroke-dasharray="5 4"/>'+
'<polyline points="190,57 198,57 198,45" fill="none" stroke="var(--bad)" stroke-width="1.4"/>'+
'<line x1="322" y1="53" x2="322" y2="137" stroke="var(--ok)" stroke-width="2"/>'+
'<polygon points="322,45 318,54 326,54" fill="var(--ok)"/><polygon points="322,145 318,136 326,136" fill="var(--ok)"/>'+
'<line x1="70" y1="28" x2="250" y2="28" stroke="var(--pri)" stroke-width="1.5"/>'+
'<line x1="70" y1="23" x2="70" y2="33" stroke="var(--pri)" stroke-width="1.5"/><line x1="250" y1="23" x2="250" y2="33" stroke="var(--pri)" stroke-width="1.5"/>'+
'<circle cx="70" cy="45" r="4.5" fill="var(--pri)"/><circle cx="250" cy="45" r="4.5" fill="var(--pri)"/><circle cx="190" cy="145" r="4.5" fill="var(--pri)"/><circle cx="110" cy="145" r="4" fill="none" stroke="var(--mut)" stroke-width="1.5"/>'+
'<g fill="var(--tx)" font-weight="700"><text x="62" y="64">A</text><text x="254" y="64">B</text><text x="196" y="166">C</text><text x="12" y="36">m</text><text x="12" y="136">n</text></g>'+
'<text x="160" y="20" text-anchor="middle" fill="var(--pri)" font-weight="700">10 cm</text>'+
'<text x="316" y="100" text-anchor="end" fill="var(--ok)" font-weight="700">4 cm</text>'+
'<text x="110" y="176" text-anchor="middle" fill="var(--mut)" font-size="11">C يتحرك على n</text>'+
'</svg>';
Q[4].f=FIG5;
var ans=[null,null,null,null,null,null],cur=0,left=300,iv=null,done=false;
function $(i){return document.getElementById(i)}
function fmt(s){return s.replace(/\d*√(?:\([^)]*\)|\d+)(?:\s*=\s*\d*√(?:\([^)]*\)|\d+))*/g,function(ch){return '<span class="mx">'+ch.replace(/(\d*)√(?:\(([^)]*)\)|(\d+))/g,function(m,c,p,n){return c+'<span class="rd"><svg class="rs" viewBox="0 0 10 20" preserveAspectRatio="none"><path d="M0.2,11.5 L2,10 L4.6,19.2 L9.6,1.1 L10.6,1.1"/></svg><span class="ov">'+(p||n)+'</span></span>'})+'</span>'})}
function show(n){["s0","s1","s2"].forEach(function(s){$(s).className=(s==n?"":"hide")+(s=="s0"?" card":"")})}
function fix(s){return s.replace(/[0-9a-zA-Z²√=−+(),.½×]+( [0-9a-zA-Z²√=−+(),.½×]+)*/g,function(m){return m})}
function render(){
 var q=Q[cur];
 $("cnt").textContent="السؤال "+(cur+1)+" من 6";
 $("pg").style.width=((cur+1)/6*100)+"%";
 $("tg").textContent=q.t=="متوسط"?"مهارة تفكير متوسطة":"مهارة تفكير عليا";
 $("qt").innerHTML=fmt(q.q);
 $("hn").textContent=q.h||"";$("hn").style.display=q.h?"block":"none";
 $("fg").innerHTML=q.f||"";
 var h="";
 q.o.forEach(function(o,i){h+='<button class="opt'+(ans[cur]===i?" sel":"")+'" data-i="'+i+'">'+"أبجد"[i]+") "+fmt(o)+"</button>"});
 $("ops").innerHTML=h;
 $("pv").disabled=cur==0;
 $("nx").textContent=cur==5?"تسليم الاختبار":"التالي";
}
function tick(){
 var m=Math.floor(left/60),s=left%60;
 $("tm").textContent=(m<10?"0":"")+m+":"+(s<10?"0":"")+s;
 $("tm").className="timer"+(left<=60?" low":"");
 if(left<=0){finish(true);return}
 left--;
}
function finish(auto){
 if(done)return;
 var ml=[];ans.forEach(function(x,i){if(x===null)ml.push(i+1)});
 if(!auto&&ml.length&&!confirm("⚠️ تنبيه: لا يوجد حل "+(ml.length>1?"للأسئلة رقم ":"للسؤال رقم ")+ml.join(" و ")+".\nهل تريدين التسليم دون حله؟\n(إلغاء = العودة إلى أول سؤال بدون حل)")){cur=ml[0]-1;render();return}
 done=true;clearInterval(iv);
 var sc=0,h="";
 Q.forEach(function(q,i){
  var ok=ans[i]===q.a;if(ok)sc++;
  h+='<div class="card"><span class="tag">سؤال '+(i+1)+(ok?" ✓":" ✗")+'</span><p class="q">'+fmt(q.q)+'</p>'+(q.f||"");
  q.o.forEach(function(o,j){
   var c="opt";if(j==q.a)c+=" ok";else if(j==ans[i])c+=" no";
   h+='<div class="'+c+'" style="padding:10px;border-radius:12px;margin-bottom:6px">'+"أبجد"[j]+") "+fmt(o)+"</div>";
  });
  if(ans[i]===null)h+='<p class="small">لم تتم الإجابة عن هذا السؤال.</p>';
  h+='<div class="ex">'+fmt(q.e)+"</div></div>";
 });
 $("rv").innerHTML=h;
 $("sc").textContent=sc+" / 6";
 $("who").textContent=($("nm").value||"")+($("cl").value?" — "+$("cl").value:"");
 $("lv").textContent=sc==6?"ممتازة! إتقان تام 🌟":sc>=5?"مستوى جيد جدًا":sc>=4?"مستوى جيد، راجعي الأسئلة الخاطئة":"تحتاجين إلى مراجعة الدرس 2-6";
 $("bk").textContent=auto?"انتهى الوقت وتم التسليم تلقائيًا.":"";
 try{localStorage.setItem("quiz26",JSON.stringify({n:$("nm").value,c:$("cl").value,s:sc,a:ans,d:new Date().toISOString()}))}catch(e){}
 show("s2");window.scrollTo(0,0);
}
$("go").onclick=function(){
 if(!$("nm").value.trim()){$("nm").focus();$("nm").style.borderColor="var(--bad)";return}
 ans=[null,null,null,null,null,null];cur=0;left=300;done=false;
 show("s1");render();tick();iv=setInterval(tick,1000);
};
$("ops").onclick=function(e){
 var b=e.target.closest(".opt");if(!b)return;
 ans[cur]=+b.getAttribute("data-i");render();
};
$("pv").onclick=function(){if(cur>0){cur--;render()}};
$("nx").onclick=function(){if(cur<5){cur++;render()}else finish(false)};
</script>
</body>
</html>
